<app-label label="NFT Data" *ngIf="nftData">
  <div class="row tw-justify-between tw-w-full">
    <p class="property row tw-justify-start">
      <span>Name:</span>
      <button class="btn-icon" (click)="copy(nftData.name)">
        {{ nftData.name }}
        <ng-template *ngTemplateOutlet="copyIcon" />
      </button>
    </p>
    <p class="property row tw-justify-start">
      <span>Wallet:</span>
      <button class="btn-icon" (click)="copy(nftData.wallet)">
        **{{ getLastFour(nftData.wallet) }}
        <ng-template *ngTemplateOutlet="copyIcon" />
      </button>
    </p>
    <p class="property row tw-justify-start">
      <span>Mint:</span>
      <button class="btn-icon" (click)="copy(nftData.mint_address)">
        **{{ getLastFour(nftData.mint_address) }}
        <ng-template *ngTemplateOutlet="copyIcon" />
      </button>
    </p>

    <p class="property row tw-justify-start">
      <span>Qty:</span>
      <span>
        {{ nftData.quantity }}
      </span>
    </p>
  </div>
</app-label>

<button
  mat-icon-button
  color="primary"
  type="button"
  matTooltip="Refresh metadata"
  (click)="onRefreshMeta()"
  [disabled]="loading$ | async"
>
  <mat-icon>refresh</mat-icon>
</button>
