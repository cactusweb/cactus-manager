<div class="col" style="grid-row: 1/3">
  <app-project-fieldset #fieldset></app-project-fieldset>
  <app-payment-fieldset #fieldset></app-payment-fieldset>
</div>

<div class="col">
  <app-personalization-fieldset #fieldset></app-personalization-fieldset>
  <app-referral-fieldset #fieldset></app-referral-fieldset>
  <app-other-fieldset #fieldset></app-other-fieldset>
</div>

<a
  mat-flat-button
  color="accent"
  target="_blank"
  [href]="guideUrl"
  class="tw-col-start-1 tw-justify-self-start"
>
  Setup Guide
  <mat-icon iconPositionEnd>open_in_new</mat-icon>
</a>

<div class="row btns">
  <button class="btn--err-outline" type="button" (click)="patchFormValue()">
    Discard changes
  </button>
  <button class="btn--primary" (click)="onSubmit()" [disabled]="loading">
    <btn-loader [isSpinner]="loading" text="Save"></btn-loader>
  </button>
</div>

<div class="overlay" *ngIf="unloadWarning">
  <div
    class="artboard"
    (click)="unloadWarning = false; $deactivating.next(false)"
  ></div>
  <app-on-before-unload
    (onClose)="unloadWarning = false"
    (onEmitStatus)="$deactivating.next($event)"
    style="width: 480px"
  ></app-on-before-unload>
</div>
